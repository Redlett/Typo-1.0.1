<!doctype html>
<html lang="en" data-theme-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typo</title>
    <link rel="stylesheet" href="/src/styles/app.css" />
  </head>
  <body>
    <div id="app">
      <header id="titlebar"></header>
      <nav id="ribbon"></nav>
      <section id="findbar" hidden></section>
      <main id="workspace">
        <div id="canvas">
          <div id="sheet-wrap">
            <div id="sheet">
              <div id="page-markers" aria-hidden="true"></div>
              <div id="editor"></div>
            </div>
          </div>
        </div>
      </main>
      <footer id="statusbar"></footer>
      <div id="backstage" hidden></div>
      <div id="overlay-root"></div>
      <div id="toast-root" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
